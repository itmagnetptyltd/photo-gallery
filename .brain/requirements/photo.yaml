- id: REQ-PHOTO-012
  title: An uploaded Photo remains in the Gallery in a later browser session
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/store.test.js
    - tests/upload-store.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "use a simple data store";
    clarified by client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 2, 11,
    17, 24, 25).
  rationale: >-
    "Data store" is the client's own word for the thing that keeps Photos. A
    Photo that exists only in the page that uploaded it would satisfy every
    other sentence in the brief and still lose the client's photographs.
  acceptance:
    - given: A Photo was uploaded during an earlier browser session
      when: The home page is opened in a new browser session with no retained client-side state
      then: That Photo is present among the tiles in the grid
    - given: A Photo was uploaded before the application was stopped
      when: The application is started again and the home page is requested
      then: That Photo is present among the tiles in the grid
    - given: A Photo was uploaded before the PC was shut down
      when: The PC is started, the application is started, and the home page is requested
      then: That Photo is present among the tiles in the grid
    - given: A Photo was uploaded in an earlier session
      when: Its stored Original is compared with the file that was chosen
      then: The stored Original is byte-identical to it
    - given: A Photo has been removed
      when: The home page is opened in a later session
      then: That Photo is not present, and the application offers no means of recovering it
  depends_on:
    - REQ-PHOTO-006

