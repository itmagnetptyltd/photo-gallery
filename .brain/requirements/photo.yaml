- id: REQ-PHOTO-005
  title: The upload modal lets a person choose an image file from their own computer
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/upload-modal.test.js
    - tests/upload-rules.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "where users can choose an image
    from their computer and upload it"; clarified by client answers, KCB,
    Sep-01-2026 (ANSWERS.md, questions 4, 5, 6, 7).
  acceptance:
    - given: The upload modal is open and no file has been chosen
      when: A file is chosen from the local file system
      then: The name of the chosen file is displayed in the modal
    - given: The upload modal is open and no file has been chosen
      when: The modal's submit control is activated
      then: No Upload is started and the number of Photos held by the system is unchanged
    - given: The upload modal is open
      when: A file that is neither a JPEG nor a PNG is chosen
      then: The file is rejected in the browser with an error message naming the accepted formats, and no data is transferred to the server
    - given: The upload modal is open
      when: A JPEG file and, separately, a PNG file are chosen
      then: Each is accepted for Upload
    - given: The upload modal is open
      when: A file larger than 10 MB is chosen and submitted
      then: The Upload is rejected, a message stating the 10 MB limit is displayed in the modal, and no Photo is created
    - given: A file that is not an accepted image is submitted directly to the server, bypassing the browser check
      when: The server receives it
      then: The server rejects it on the basis of the file content and type, and no Photo is created
    - given: The upload modal is open
      when: The file chooser is used
      then: Exactly one file can be selected, and selecting several files at once is not offered
  depends_on:
    - REQ-PHOTO-004

- id: REQ-PHOTO-006
  title: A submitted image file becomes a new Photo held by the system
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/store.test.js
    - tests/upload-store.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "choose an image from their
    computer and upload it" and "the new photo should be added to the gallery";
    clarified by client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 2, 10,
    11, 12, 25).
  acceptance:
    - given: An acceptable image file has been chosen in the upload modal
      when: The modal's submit control is activated and the Upload completes
      then: The number of Photos held by the system has increased by exactly one
    - given: An Upload has completed successfully
      when: The home page is requested afresh
      then: The newly created Photo is among the tiles presented
    - given: The same image file is uploaded twice
      when: Both Uploads complete
      then: Two Photos are held by the system and two separate tiles are presented, not one
    - given: An Upload has completed successfully
      when: The stored Original is compared with the file that was chosen
      then: The stored Original is byte-identical to the chosen file, and no control offering to download the Original is presented
    - given: An Upload has completed successfully
      when: The Photo's stored files are inspected
      then: A thumbnail Rendition smaller than the Original has been generated and stored for that Photo
    - given: The available local disk space is exhausted
      when: An Upload is submitted
      then: The Upload fails with a message to the person, and no Photo record and no partial file remain
  depends_on:
    - REQ-PHOTO-005

- id: REQ-PHOTO-007
  title: An Upload that fails is reported to the person and creates no Photo
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/store.test.js
    - tests/upload-store.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "choose an image from their
    computer and upload it". The brief did not describe failure at all; the
    failure path was confirmed and specified by client answers, KCB, Sep-01-2026
    (ANSWERS.md, questions 5, 6, 8, 9).
  rationale: >-
    An Upload that fails silently is indistinguishable from one that succeeded,
    and the person's own copy of the file is the only remaining record. What the
    person is told, and whether anything is left behind, decides whether they
    upload again or believe the Photo is safe.
  acceptance:
    - given: An Upload has been submitted and the system cannot complete it
      when: The attempt ends
      then: A failure message is displayed in the modal and the modal does not close by itself
    - given: An Upload has been submitted and the system cannot complete it
      when: The attempt ends
      then: The number of Photos held by the system is unchanged from before the attempt
    - given: An Upload has failed part-way
      when: The failure message is displayed
      then: The person can submit the same file again from the modal without reopening it
    - given: An Upload has failed part-way after some data was written
      when: The stored Photos and stored files are inspected
      then: No Photo record and no partial file remain from the failed attempt
  depends_on:
    - REQ-PHOTO-006

- id: REQ-PHOTO-008
  title: A newly uploaded Photo appears in the grid without the page being reloaded
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/live-insert.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "After uploading, the new photo
    should be added to the gallery and immediately displayed in the grid";
    clarified by client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 3, 14,
    18, 24).
  acceptance:
    - given: The home page is open showing N Photo tiles
      when: An Upload completes successfully in the modal
      then: The grid presents N+1 tiles, one of which is the new Photo, without the person reloading the page
    - given: The uploading person's home page is open
      when: Their Upload completes successfully
      then: The new tile appears in their own open grid without a full page reload, and no update of any other person's already-open grid is required
    - given: The grid is ordered with the most recent Upload first
      when: An Upload completes successfully
      then: The new tile appears in the first position of the grid
  depends_on:
    - REQ-PHOTO-001
    - REQ-PHOTO-006

- id: REQ-PHOTO-009
  title: Activating a Photo in the grid opens that Photo in a larger view
  module: PHOTO
  priority: must
  status: verified
  verified_by:
    - tests/lightbox.test.js
  version: 1
  source: >-
    Client email, KCB, Sep-01-2026 (BRIEF.md): "Clicking any photo should open
    it in a larger view so the user can see it properly"; clarified by client
    answers, KCB, Sep-01-2026 (ANSWERS.md, questions 2, 11, 13, 19, 20, 21, 22).
  acceptance:
    - given: The home page is displayed with at least two Photos
      when: One Photo's tile is activated
      then: That same Photo is presented in a larger view, and the Photo shown is the one whose tile was activated
    - given: A Photo's tile is displayed at the grid's tile dimensions
      when: That tile is activated
      then: The Photo is rendered in the larger view at greater width and height than the tile
    - given: The home page is displayed
      when: A Photo's tile is activated
      then: The larger view is presented as an overlay in front of the home page, the browser address does not change, and the home page is not replaced by a separate Photo page
    - given: A Photo is open in the larger view
      when: The displayed image is inspected
      then: The image delivered is the Photo's Original, not its thumbnail Rendition, and it is sized to fit within the available viewport
    - given: A Photo is open in the larger view
      when: The larger view is inspected
      then: The image is presented alone, with no filename, size, date or other metadata text
    - given: A Photo is open in the larger view and at least two Photos are held
      when: The next control is activated and then the previous control is activated
      then: The larger view shows the following Photo and then returns to the Photo it started on
    - given: A Photo's tile has keyboard focus and no pointing device is used
      when: The Enter key is pressed
      then: That Photo opens in the larger view
  depends_on:
    - REQ-PHOTO-001

