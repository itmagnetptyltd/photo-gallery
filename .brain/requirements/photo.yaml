  rationale: >-
    The client raised dependencies unprompted, which suggests they expect to be
    able to read and maintain the result themselves. The answer of Sep-01-2026
    gives the test for necessity and the three purposes that qualify.
  acceptance:
    - given: The delivered application
      when: Its declared third-party runtime dependencies are listed
      then: Every entry provides functionality that is not reasonably available from the Node.js standard library or the application's own code
    - given: The delivered application
      when: Its declared third-party runtime dependencies are listed
      then: Each entry serves the web server, SQLite access or image thumbnail generation, and no entry serves any other purpose

# ---------------------------------------------------------------------------
# Second brief — Sep-01-2026 (BRIEF.md, "Second brief"), raised as FB-0001 and
# scoped by CHG-0001.
#
# REQ-PHOTO-016 onward decompose the visual-design feedback. Every one is now
# `agreed` at `version: 1`: questions 29 to 50 were all answered by KCB on
# Sep-01-2026 (ANSWERS.md), and the palette, typeface, sizes, radius, product
# name and standard of judgement the brief left out are settled there. Nothing
# in this block was chosen by the delivery team — choosing is exactly what
# produced FB-0001.
#
# Answer 30 makes the design token sheet the gate: the delivery team proposes
# the palette, typeface stack, text-size scale, spacing scale, corner radius,
# focus ring and button variants, the client approves them in one round, and
# only then is styling built. Answer 29 makes acceptance a single demo against
# that approved sheet, and anything asked for after it a variation.
#
# Answer 47 accepts that these nine rest at `agreed` on a recorded demo
# acceptance and do not reach `verified`: no browser automation is added, so no
# test annotates them. The evidence rule in README.md is not waived — it is met
# by nothing, knowingly, and that is the client's decision on the record.
#
# THAT POSITION TURNED OUT TO BE UNIMPLEMENTABLE. Two facts collide with it, and
# both are recorded with their evidence in
# `.brain/constraints/sign-off-cannot-be-recorded-without-a-test.md`:
#   - "rest at `agreed`" became unreachable when slice 8 was built, because
#     /tdd must move a requirement to `in_progress` first and the lifecycle is
#     forward-only. REQ-PHOTO-017..019 are at `in_progress` and cannot go back.
#   - `signed_off` also requires a `verified_by` entry, so a requirement that
#     never reaches `verified` can never record the client's acceptance either.
# REQ-PHOTO-016 is the sharpest case: its acceptance is a human verdict, so on
# the plain reading nothing can ever close it.
# The collision is a scope matter for KCB, not a reading for us to choose.
# Until they answer, nothing in this group moves.
#
# Two asks in that brief are still NOT decomposed here, and the answers confirm
# that reading rather than overturning it:
#   - "a visible focus ring on every interactive element" — answer 43: already
#     met by the `:focus-visible` outline shipping under REQ-PHOTO-011@v1, and
#     restyled to the token sheet. REQ-PHOTO-011 is NOT versioned.
#   - "a designed empty state" — answer 44: already exists under
#     REQ-PHOTO-001@v1 criterion 7, restyled with everything else and gaining
#     nothing structurally. REQ-PHOTO-001 is NOT versioned.
# ---------------------------------------------------------------------------

- id: REQ-PHOTO-016
  title: The Gallery's visual design is judged professional at a recorded client review
  module: PHOTO
  priority: must
  status: agreed
  version: 1
  source: >-
    Client feedback, KCB, Sep-01-2026 (BRIEF.md, second brief): "The gallery works but looks
    amateur. It needs to look professional". Raised as FB-0001 and scoped by CHG-0001; clarified by
    client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 29, 30, 31, 42, 43, 44, 45, 46, 47).
  rationale: >-
    FB-0001 records how this gap was made. In the first brief "attractive" was decomposed into
    structural criteria and the adjective was carried into none of them, so nothing in the record
    ever required the result to look good and the build stopped at the criteria that existed. Unless
    the judgement itself is written down as something a named person must record a verdict on, the
    same gap reopens at the next review.
  acceptance:
    - given: >-
        The Gallery running on a local development PC and rendered in a browser, showing the home
        page with Photos, the home page with no Photo, the upload modal and the Larger view
      when: The client reviews those four views
      then: >-
        A verdict is recorded against REQ-PHOTO-016 that is either acceptance or a written list of
        specific changes, and this requirement does not pass without that record
    - given: No browser has rendered this application in any check to date, as FB-0001 states
      when: This requirement is assessed
      then: >-
        The assessment is made against the running application rendered in a browser, not against
        its stylesheet or markup alone
    - given: A recorded review has produced a written list of specific changes
      when: That list is compared with this requirement file
      then: >-
        Each change is traceable to an existing requirement id or raises a new one, and none is
        closed by the delivery team deciding it is unnecessary
    - given: >-
        A design token sheet setting out the palette, typeface stack, text-size scale, spacing
        scale, corner radius, focus ring and button variants
      when: Any styling work under REQ-PHOTO-017 to REQ-PHOTO-024 is begun
      then: >-
        The client has already recorded approval of that sheet, and styling built before that
        approval is not accepted under this requirement
    - given: The client has approved the token sheet and the demo has recorded acceptance
      when: A further change to the look is asked for
      then: >-
        It is raised as a variation through /find-variation, and is not treated as a defect against
        this requirement
    - given: The delivered Gallery
