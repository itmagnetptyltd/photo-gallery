- id: REQ-PHOTO-020
  title: Every button in the Gallery is presented with one defined visual treatment
  module: PHOTO
  priority: must
  status: agreed
  version: 1
  source: >-
    Client feedback, KCB, Sep-01-2026 (BRIEF.md, second brief): "styled buttons", the styled half of
    "styled buttons with hover and focus states"; clarified by client answers, KCB, Sep-01-2026
    (ANSWERS.md, questions 30, 31, 39, 42, 50).
  acceptance:
    - given: A button treatment has been defined for the Gallery
      when: >-
        The "+ Upload Photo" control, the upload modal's controls and the Larger view's controls are
        inspected
      then: >-
        Each is presented with that defined treatment, and no button is presented with a treatment
        outside the defined set
    - given: The delivered Gallery
      when: Any button is inspected
      then: >-
        It is presented with the defined treatment rather than the browser's default control
        appearance
    - given: Two buttons of the same defined variant appear on different views
      when: Their presentation is compared
      then: Their visual treatment is identical
    - given: The approved token sheet
      when: The button variants defined on it are counted
      then: There are exactly two — primary and secondary — and no third variant is defined
    - given: The delivered Gallery
      when: Each button is matched to its variant
      then: >-
        The "+ Upload Photo" control and the confirming action inside the upload modal are primary,
