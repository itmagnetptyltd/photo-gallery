    - given: The delete confirmation covered by REQ-PHOTO-005@v1
      when: Its controls are inspected
      then: >-
        They use the secondary treatment, and no separate destructive variant exists anywhere in the
        Gallery
    - given: The delivered buttons
      when: The single accent colour named on the token sheet is looked for
      then: It appears on the primary variant only, and no secondary button uses it
    - given: The single corner-radius value named on the token sheet
      when: A button is inspected
      then: Its corners are rounded by that same value
  depends_on:
    - REQ-PHOTO-003
    - REQ-PHOTO-017
    - REQ-PHOTO-018

- id: REQ-PHOTO-021
  title: Every button presents a hover state distinct from its resting state
  module: PHOTO
  priority: must
  status: agreed
  version: 1
  source: >-
    Client feedback, KCB, Sep-01-2026 (BRIEF.md, second brief): "styled buttons with hover and focus
    states", the hover half. The focus half is not decomposed here — see question 43. Clarified by
    client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 30, 37, 43).
  acceptance:
    - given: A pointing device is in use and a button is displayed in its resting state
      when: The pointer is moved over the button
      then: At least one visual property of the button differs from its resting state
    - given: A button is in its hover state
      when: The pointer leaves the button
      then: The button returns to the presentation it had before the pointer arrived
    - given: A pointing device is in use and several buttons are displayed
      when: The pointer is over exactly one of them
      then: Only that button changes, and every other button stays in its resting state
    - given: A button in its resting state
      when: The pointer is moved over it
      then: >-
        Its background and its border change, and nothing is revealed that was not already shown, so
        a person using touch or the keyboard alone loses nothing
    - given: The same button given keyboard focus, and hovered
      when: The two presentations are compared
      then: >-
        Keyboard focus is given the same visual weight as hover, so neither is harder to see than
        the other
    - given: The `:focus-visible` outline shipping today under REQ-PHOTO-011@v1
      when: The restyled Gallery is inspected
      then: >-
        The rule is still present, drawn in the token sheet's colour and width, and the existing
        assertion in tests/responsive.test.js still holds
  depends_on:
    - REQ-PHOTO-020

