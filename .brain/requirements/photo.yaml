- id: REQ-PHOTO-017
  title: Text throughout the Gallery is sized from one defined type scale
  module: PHOTO
  priority: must
  status: in_progress
  version: 1
  source: >-
    Client feedback, KCB, Sep-01-2026 (BRIEF.md, second brief): "a proper type and spacing scale",
    the type half; clarified by client answers, KCB, Sep-01-2026 (ANSWERS.md, questions 30, 32, 48).
  acceptance:
    - given: A type scale has been defined for the Gallery
      when: The text of the home page, the upload modal and the Larger view is inspected
      then: >-
        Every text element is sized at one of the steps of that scale, and no text is sized by a
        value outside it
    - given: A type scale has been defined for the Gallery
      when: The same kind of text element appears on more than one view
      then: It is sized at the same step of the scale on each of those views
    - given: The delivered Gallery
      when: Its type scale is looked for
      then: >-
        The steps of the scale are recorded in one place a person can read, rather than being
        inferable only from the rendered result
    - given: The approved token sheet
      when: Its text-size scale is read
      then: >-
        It lists named steps — app bar title, section heading, body, small and caption — and the
        stylesheet expresses each of them as a named token
    - given: The delivered Gallery
      when: The typeface its text is set in is inspected
      then: >-
        It is a system font stack naming typefaces already present on the person's computer, and no
        font file ships with the application
    - given: The Gallery is opened in a browser
      when: The requests the page makes are inspected
      then: No font file is downloaded, so REQ-PHOTO-014@v1 and REQ-PHOTO-015@v1 are unaffected
  depends_on:
    - REQ-PHOTO-001

